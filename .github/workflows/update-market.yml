name: 更新A股市场数据

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/update-market.yml"
  schedule:
    # UTC -> 北京时间 09:35、10:30、11:30、13:45、14:30、15:00
    - cron: "35 1 * * 1-5"
    - cron: "30 2 * * 1-5"
    - cron: "30 3 * * 1-5"
    - cron: "45 5 * * 1-5"
    - cron: "30 6 * * 1-5"
    - cron: "0 7 * * 1-5"

permissions:
  contents: write

concurrency:
  group: market-data-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 采集并校验
        env:
          HITHINK_FINANCE_API_KEY: ${{ secrets.HITHINK_FINANCE_API_KEY }}
        run: |
          if [ -n "$HITHINK_FINANCE_API_KEY" ]; then
            python scripts/fetch_hithink.py
          else
            python scripts/fetch_market.py
          fi
      - name: 采集情绪结构与盘中时间轴
        env:
          HITHINK_FINANCE_API_KEY: ${{ secrets.HITHINK_FINANCE_API_KEY }}
        run: python scripts/fetch_emotion.py
      - name: 生成三层周期与龙头生态判断
        run: python scripts/build_cycle_analysis.py
      - name: 合并工作台主数据
        run: python scripts/build_workbench.py
      - name: 保存最新快照
        run: |
          if git diff --quiet -- data/market_latest.json data/hithink_latest.json data/emotion_latest.json data/emotion_history.json data/intraday_latest.json data/intraday_history.json data/cycle_analysis_latest.json data/workbench_latest.json; then
            echo "数据未变化"
            exit 0
          fi
          git config user.name "market-data-bot"
          git config user.email "market-data-bot@users.noreply.github.com"
          git add data/market_latest.json data/emotion_latest.json data/emotion_history.json data/intraday_latest.json data/intraday_history.json data/cycle_analysis_latest.json data/workbench_latest.json
          if [ -f data/hithink_latest.json ]; then git add data/hithink_latest.json; fi
          git commit -m "data: update market and cycle snapshots"
          git pull --rebase origin main
          git push
