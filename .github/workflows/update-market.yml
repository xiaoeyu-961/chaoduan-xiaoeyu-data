name: 更新A股市场数据

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/update-market.yml"
  schedule:
    - cron: "17,27,37,47,57 1-2,5-6 * * 1-5"
    - cron: "7,17,27 3,7 * * 1-5"

permissions:
  contents: write

concurrency:
  group: market-data-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 采集并校验
        run: python scripts/fetch_market.py
      - name: 保存最新快照
        run: |
          if git diff --quiet -- data/market_latest.json; then
            echo "数据未变化"
            exit 0
          fi
          git config user.name "market-data-bot"
          git config user.email "market-data-bot@users.noreply.github.com"
          git add data/market_latest.json data/cycle_latest.json
          git commit -m "data: update A-share market snapshot"
          git push
