name: 更新A股市场数据

on:
  workflow_dispatch:
    inputs:
      backfill_history:
        description: "即使当日休市，也使用最后有效交易日补齐20日历史"
        required: false
        default: true
        type: boolean
  push:
    paths:
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/update-market.yml"
  schedule:
    # 交易时段约每10分钟，并额外保留六个关键节点。
    - cron: "*/10 1-3,5-7 * * 1-5"
    - cron: "35 1 * * 1-5"
    - cron: "30 2 * * 1-5"
    - cron: "30 3 * * 1-5"
    - cron: "45 5 * * 1-5"
    - cron: "30 6 * * 1-5"
    - cron: "0 7 * * 1-5"

permissions:
  contents: write

concurrency:
  group: market-data-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 采集并校验
        id: collect
        continue-on-error: true
        env:
          HITHINK_FINANCE_API_KEY: ${{ secrets.HITHINK_FINANCE_API_KEY }}
        run: python scripts/fetch_hithink.py
      - name: 保存采集失败记录
        if: steps.collect.outcome == 'failure'
        run: |
          git config user.name "market-data-bot"
          git config user.email "market-data-bot@users.noreply.github.com"
          git add data/raw/ data/status_latest.json
          git commit -m "data: record failed market snapshot"
          git pull --rebase origin main
          git push
          exit 1
      - name: 采集情绪结构与盘中时间轴
        if: >-
          steps.collect.outcome == 'success' &&
          (steps.collect.outputs.market_skipped != 'true' ||
           github.event_name == 'push' ||
           inputs.backfill_history == true)
        env:
          HITHINK_FINANCE_API_KEY: ${{ secrets.HITHINK_FINANCE_API_KEY }}
        run: python scripts/fetch_emotion.py
      - name: 生成三层周期与龙头生态判断
        if: >-
          steps.collect.outcome == 'success' &&
          (steps.collect.outputs.market_skipped != 'true' ||
           github.event_name == 'push' ||
           inputs.backfill_history == true)
        run: python scripts/build_cycle_analysis.py
      - name: 合并工作台主数据
        if: >-
          steps.collect.outcome == 'success' &&
          (steps.collect.outputs.market_skipped != 'true' ||
           github.event_name == 'push' ||
           inputs.backfill_history == true)
        run: python scripts/build_workbench.py
      - name: 保存最新快照
        if: >-
          steps.collect.outcome == 'success' &&
          (steps.collect.outputs.market_skipped != 'true' ||
           github.event_name == 'push' ||
           inputs.backfill_history == true)
        run: |
          if git diff --quiet -- data/; then
            echo "数据未变化"
            exit 0
          fi
          git config user.name "market-data-bot"
          git config user.email "market-data-bot@users.noreply.github.com"
          git add data/
          git commit -m "data: update market and cycle snapshots"
          git pull --rebase origin main
          git push
